# Cache policy (#328), by path, so it is set once at the server level below and
# no location needs an `add_header` of its own (which would drop the security
# set). `immutable` is a promise that the bytes behind a name never change, so
# it goes only where the name is a content hash: Astro's `/_astro/` and the
# diagram SVGs in `/beoe/`. Fonts, images and the favicon keep a stable name, so
# they expire in a day. Pages, feeds and `/version.json` revalidate every time:
# a stale release number answers "which release is prod running" wrongly
# (WEB-106, #190).
map $uri $path_cache_control {
    ~^/_astro/                                   "public, max-age=31536000, immutable";
    ~^/beoe/                                     "public, max-age=31536000, immutable";
    /version.json                                "no-cache";
    ~*\.(css|js|woff2?|png|jpe?g|webp|avif|ico|svg)$ "public, max-age=86400";
    default                                      "no-cache";
}

# An error revalidates whatever its path. A 404 is answered under `/404.html`,
# but every other error keeps the request's URI, so without this a 405 or a 500
# for a hashed asset went out as immutable and a cache could keep it a year.
# `$status` is read when the header is sent, so it is the final status.
map $status $cache_control {
    ~^[45]   "no-cache";
    default  $path_cache_control;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Compression. Nothing upstream compresses: measured 2026-11-02, prod and
    # staging answered /lab/ with 111 KB and no Content-Encoding to a client
    # that accepts gzip and br. text/html is always in gzip_types. nginx treats
    # a request carrying a `Via` header as proxied and, by default, does not
    # compress it; `proxied any` keeps compression on if the edge ever adds one.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # One URL per page: the directory form. `/notes` 301s to `/notes/` by nginx
    # itself, once `try_files` below tries `$uri/`. A relative `Location` keeps
    # that redirect on the edge's host and scheme: an absolute one would name
    # this container's plain port 8080.
    absolute_redirect off;

    # `$request_uri` and not a location: nginx reaches `/notes/index.html`
    # internally through `index`, and a location would redirect its own lookup
    # in a loop. `$request_uri` only ever holds what the client asked for, so
    # every segment must be non-empty: `$1` becomes the `Location`, and
    # `//evil.com/index.html` would send a browser to another host.
    if ($request_uri ~ ^((?:/[^/?\x5c]+)*/)index\.html(\?.*)?$) {
        return 301 $1$2;
    }

    # Security headers. These must equal Traefik's `secure-headers` middleware
    # (kubelab `infra/k8s/base/edge/secure-headers.yaml`), because through the
    # ingress the edge's values REPLACE these and the divergence is invisible
    # from outside — measured as `SAMEORIGIN` here against `DENY` on the wire
    # (WEB-111). What the origin declares is what serves when the middleware is
    # absent: `docker run`, a port-forward, or a route that omits it.
    #
    # HSTS, CSP and the TLS redirect are deliberately not here. This server
    # listens on plain 8080 and TLS terminates at the edge, so they are the
    # edge's to send. `tests/nginx-security-headers.test.mjs` asserts the rest.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control $cache_control always;

    # Static assets: a miss is a 404, never a directory lookup. The cache policy
    # is the map above; a location here that set any header would replace the
    # server's whole set (nginx-security-headers.test.mjs).
    location ~* \.(css|js|woff2?|png|jpe?g|webp|avif|ico|svg)$ {
        try_files $uri =404;
    }

    # Astro static routes
    location / {
        try_files $uri $uri/ =404;
    }

    # Custom 404, one per locale. `error_page` keeps the request path.
    # `=404` because a directory with no index (`/tags/`) makes nginx answer 403.
    error_page 404 /404.html;
    error_page 403 =404 /404.html;
    location = /404.html {
        internal;
    }

    # `^~` keeps a missing `/es/x.svg` out of the asset regex above, which would
    # answer it in English. Nothing but HTML is built under `/es/`.
    location ^~ /es/ {
        try_files $uri $uri/ =404;
        error_page 404 /es/404/index.html;
        error_page 403 =404 /es/404/index.html;
    }
    location = /es/404/index.html {
        internal;
    }

    # The Spanish course and newsletter pages are gone (they sold a course
    # beside a hiring profile). Old links land on the Spanish home, not a 404.
    # Exact matches win over the `^~ /es/` prefix above.
    location = /es/nodo { return 301 /es/; }
    location = /es/nodo/ { return 301 /es/; }
    location = /es/rompe { return 301 /es/; }
    location = /es/rompe/ { return 301 /es/; }
    location = /es/newsletter { return 301 /es/; }
    location = /es/newsletter/ { return 301 /es/; }
}
