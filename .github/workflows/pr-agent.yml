---
name: pr-agent

# The PR-Agent reviewer (TOOL-013 / ADR-032), called from the fleet's reusable
# workflow in mlorentedev/ci-workflows (dotfiles TOOL-031) instead of a local
# port. The local port had drifted from the dotfiles canon: one PR-Agent step
# under a 15-minute job, so a primary model that stalled used up the job before
# the fallback could answer, and the run was cancelled with no review (WEB-165).
# The reusable workflow runs each model attempt as its own step with its own
# budget, and its guard checks that a review was published. Decisions are
# `dotf pr ...` at the release the pinned tag names; bumping the pin brings them.
#
# Kept here: the triggers, the per-PR concurrency, the permissions, and the
# skips below. `.pr_agent.toml` (instructions, response language) and
# `harness/review-attestation.json` are read from the default branch.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Skipped before a runner is spent. The reusable workflow repeats the
    # Dependabot and fork exclusions; the draft and release-please skips are
    # its `dotf pr reviewable` decision too, but a skipped job costs nothing.
    #
    # Dependabot-triggered runs read the Dependabot secrets store, which is
    # empty here, so the credential is "" and the run fails (HARNESS-080,
    # dotfiles#1221). `dependabot[bot]` cannot be claimed by a user because `[`
    # is not allowed in a login. A person typing `/review` on a dependency PR
    # still gets a review, with the secrets present.
    if: >
      (github.event_name == 'pull_request'
        && github.event.pull_request.draft == false
        && github.actor != 'dependabot[bot]'
        && github.event.pull_request.head.repo.fork == false
        && !startsWith(github.head_ref, 'release-please--'))
      || (github.event_name == 'issue_comment'
            && github.event.issue.pull_request
            && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                        github.event.comment.author_association)
            && startsWith(github.event.comment.body, '/'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: mlorentedev/ci-workflows/.github/workflows/pr-agent.yml@d601782ceac77ad4dc52833cd94106245ee20f44 # v0.4.0
    with:
      skip_branch_prefixes: release-please--
    secrets:
      NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
      # Not set in this repository today, so every review routes to NaN. Set it
      # (`dotf secrets sync ci`) to let the pool draw Anthropic models too.
      PR_AGENT_ANTHROPIC_API_KEY: ${{ secrets.PR_AGENT_ANTHROPIC_API_KEY }}
