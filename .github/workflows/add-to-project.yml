name: Add to bitácora

# Puts every opened/reopened issue and PR onto the cross-repo bitácora board
# (GitHub Project #1). Pairs with bitacora-status.yml (which flips an assigned
# issue to In Progress). Canonical copy for the OPS-002 (#258) multi-repo rollout.

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    # Fork PRs and Dependabot PRs run without repository secrets — BITACORA_PAT would
    # be empty and the job would fail (Codex review on kubelab#237; Dependabot on
    # kubelab#614). Skip them; they reach the board via the rollout backfill or a
    # manual item-add.
    if: >-
      github.event_name == 'issues' ||
      (github.event.pull_request.head.repo.fork == false &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      # Pin a real release: actions/add-to-project@v1 does NOT resolve (no floating v1 tag).
      - uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/users/mlorentedev/projects/1
          # BITACORA_PAT and not GITHUB_TOKEN, and this cannot be "simplified":
          # the board is a user-level Project v2, outside this repository, and
          # GITHUB_TOKEN is scoped to the repository that issued it. REST is no
          # fallback either — its project endpoints are organization-scoped, so
          # a user-owned board has none, and updating an item's fields is
          # GraphQL-only whoever owns it.
          #
          # This action authenticates as a user, so it draws on that account's
          # 5,000/hour bucket — shared with every PAT that account holds and
          # every interactive session using one. On 2026-08-31 that bucket ran
          # out: this job failed, a manual re-run failed identically, and
          # #255/#256 never reached the board. See #256 — the fix is a GitHub
          # App, whose installation token has its own limit. Minting more PATs
          # would not help; they would all share this same bucket.
          github-token: ${{ secrets.BITACORA_PAT }}
