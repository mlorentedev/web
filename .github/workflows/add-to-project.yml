name: Add to bitácora

# Puts every opened/reopened issue and PR onto the cross-repo bitácora board
# (GitHub Project #1). Pairs with bitacora-status.yml (which flips an assigned
# issue to In Progress). Canonical copy for the OPS-002 (#258) multi-repo rollout.

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    # Fork PRs and Dependabot PRs run without repository secrets — BITACORA_PAT would
    # be empty and the job would fail (Codex review on kubelab#237; Dependabot on
    # kubelab#614). Skip them; they reach the board via the rollout backfill or a
    # manual item-add.
    if: >-
      github.event_name == 'issues' ||
      (github.event.pull_request.head.repo.fork == false &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      # Pin a real release: actions/add-to-project@v1 does NOT resolve (no floating v1 tag).
      - uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/users/mlorentedev/projects/1
          # BITACORA_PAT and not GITHUB_TOKEN, and this cannot be "simplified":
          # the board is a user-level Project v2, outside this repository, and
          # GITHUB_TOKEN is scoped to the repository that issued it. Projects v2
          # is also GraphQL-only — there is no REST fallback for a human or an
          # agent to reach for when this fails.
          #
          # It shares a rate limit with every other automation and session on
          # this account, and on 2026-08-31 that limit ran out: this job failed,
          # a manual re-run failed identically, and #255/#256 never reached the
          # board. See #256 — the fix is a GitHub App, because rate limits are
          # per *user*, not per token, so issuing more PATs would not help.
          github-token: ${{ secrets.BITACORA_PAT }}
