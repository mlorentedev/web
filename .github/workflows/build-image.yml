---
name: Build Image

# Pull request image build (ADR-053 / ADR-046 / ADR-055): builds the Astro site
# image without pushing it, loads it into the runner's docker and scans it with
# Trivy, so a PR is scanned before it can reach master (WEB-119). Its one
# caller is pr-validation.yml (tag=pr-<n>).
#
# The master build that ships is not here: release.yml calls ci-workflows'
# shared docker-publish.yml (CI-010), which pushes by digest, scans every
# platform and tags only after the scans pass.
#
# The build is ci-workflows' docker-build composite. `commit` becomes the
# `SITE_COMMIT` build arg, which the site states as `commit` in /version.json
# (WEB-150); pr-validation.yml passes nothing, and the image then says "local".

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to build (e.g. pr-123)
        type: string
        required: true
      commit:
        description: Short sha the site states as `commit` (empty = "local", for untagged builds)
        type: string
        default: ''
      platforms:
        description: Target platform. One only, since the image is loaded into the runner's docker.
        type: string
        default: linux/amd64

permissions:
  contents: read
  security-events: write   # upload the Trivy SARIF to the Security tab

env:
  IMAGE: mlorentedev/kubelab-web

jobs:
  build:
    name: Build ${{ inputs.tag }}
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 6h ceiling. A build that stalls
    # rather than fails then burns six hours of runner before anyone notices
    # (docs/lessons/lesson-011). A PR build is linux/amd64 alone and lands
    # around 20 s warm; 20 min is several times the cold worst case.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The SARIF upload below sends whatever trivy-results.sarif it finds. A
      # pull request could commit one, and if the scan then failed before
      # writing its own, the committed file would be uploaded as the scan.
      - name: Discard a SARIF report the checkout carries
        run: rm -f trivy-results.sarif

      - name: Build
        id: build
        uses: mlorentedev/ci-workflows/.github/actions/docker-build@9b34f5b2815a3090d77d7589ef8bcc5087045544 # v0.8.0
        env:
          # The build uploads a `.dockerbuild` record after every build. Keep it
          # (it carries the cache and timing telemetry worth having right after
          # a build misbehaves), but for a week, not the repo's 90 days: they had
          # piled up to 211 artefacts, none ever downloaded.
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 7
        with:
          image: ${{ env.IMAGE }}
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          platforms: ${{ inputs.platforms }}
          # Not pushed, so loaded into the runner's docker for the scan below.
          load: 'true'
          build-args: |
            SITE_COMMIT=${{ inputs.commit }}
          # The layer cache lives on the `buildcache` tag, not in the Actions
          # cache: `type=gha,mode=max` held that at its 10 GB ceiling and got the
          # npm and Playwright caches evicted between runs (WEB-202). A PR reads
          # it anonymously (the repository is public) and writes nothing; only
          # release.yml's push writes it. A failed read is a cold build.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-write: 'false'
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}

      # This step only reports: CRITICAL and HIGH go to the Security tab, and
      # `continue-on-error` keeps a scanner failure (a database download, say)
      # from failing the job. Blocking is the gate step after the upload.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE }}:${{ inputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # The category is the one release.yml's linux/amd64 scan uploads under
      # (docker-publish appends the platform), so a PR's alerts are compared
      # with master's.
      - name: Upload Trivy SARIF
        if: ${{ hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-web-linux-amd64

      # Blocks on CRITICAL since 2026-11-10 (WEB-119 AC3), once the base image
      # scanned clean. HIGH stays advisory in the report above: a new HIGH in
      # the base image would otherwise fail every PR until the next bump.
      # `ignore-unfixed` because no change in this repo can clear a finding
      # with no fixed version. It runs after the upload, so a blocked build
      # still shows the finding in the Security tab. docker-publish's gate on
      # master is the same: CRITICAL, unfixed ignored, failing closed.
      #
      # It fails closed: a scanner error fails the build too, since a gate
      # that passes when it cannot scan is not a gate.
      - name: Trivy gate on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ inputs.tag }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
