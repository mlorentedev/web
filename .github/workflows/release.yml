---
name: Release & Deploy

# Consolidated master-push delivery (ADR-046 / ADR-053 / ADR-055). One build per
# push serves BOTH environments by digest — build-once, promote-by-digest:
#
#   1. release-please accumulates Conventional Commits into a release PR.
#   2. Every push runs the test suite, then builds ONE immutable `sha-<short>`
#      image (multi-arch), pushes it, runs the suite again on the tree that
#      image serves (by digest, #376), and only then fires a repository_dispatch
#      to mlorentedev/kubelab → staging. A red suite stops the push there.
#   3. When a release PR merges, the SAME image digest is re-tagged to the clean
#      semver `X.Y.Z` (no rebuild) — so prod ships the exact bytes staging
#      validated. Fires a repository_dispatch to mlorentedev/kubelab to open the
#      gated prod promotion PR (ADR-046 / WEB-108).
#
# The `latest` alias means the newest COMPLETED semver release, byte-identical to
# that semver tag. It is human-facing only (the `docker run` line in README.md);
# no manifest, overlay or job in either repo may pin it, and a push build never
# writes it. Contract: docs/adr/ADR-058-mutable-latest-tag-contract.md.
#
# Pull-request validation (Dockerfile build, no push) lives in pr-validation.yml.
#
# Required secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (build/push/re-tag);
# KUBELAB_DISPATCH_TOKEN (kubelab contents:write — the dispatch);
# RELEASE_PLEASE_PAT, so the release PR triggers pull_request checks. Without it
# the Release Please job fails (WEB-117); build and staging do not depend on it.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # Measured 14 s on average, 23 s at worst over 15 runs. The cap leaves room
    # for GitHub API latency, which this job spends (see #256).
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.gate.outputs.created }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      # It used to fall back to GITHUB_TOKEN, which opens the release PR with no
      # checks, so a rotated or deleted PAT showed only as checks that never
      # appeared. Same cure as pr-agent.yml's credential step (#337).
      - name: Fail if the release PAT is not set
        env:
          HAS_RELEASE_PLEASE_PAT: ${{ secrets.RELEASE_PLEASE_PAT != '' }}
        run: |
          if [ "${HAS_RELEASE_PLEASE_PAT}" != "true" ]; then
            echo "::error::RELEASE_PLEASE_PAT is not set in this repository's Actions secrets," \
              "so the release PR would open with no checks."
            echo "::error::Remedy: set it with \`gh secret set RELEASE_PLEASE_PAT --repo ${GITHUB_REPOSITORY}\`." \
              "Replacing this PAT with a GitHub App is mlorentedev/dotfiles#2836."
            exit 1
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          # RELEASE_PLEASE_PAT, because a pull request opened with GITHUB_TOKEN
          # does not get its checks on its own: GitHub suppresses workflow runs
          # from events the token itself caused, and where it does raise a
          # `pull_request` run it can hold it in an approval-required state. A
          # release PR nobody approves is a release PR with no signal.
          #
          # The cost is that it spends the account's shared rate limit. On
          # 2026-08-31 this job failed on two consecutive merges with
          # "API rate limit already exceeded", drained by agent sessions in
          # other repositories, and the release PR silently stopped tracking
          # master while every other job in this workflow went green — the same
          # invisible shape as #172. Recovered with
          # `POST /actions/runs/{id}/rerun-failed-jobs`. See #256.
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Normalize outputs: manifest mode keys them by package path
      # ('.--version', '.--release_created'), simple mode at top level. An
      # output-format change fails this step instead of reading as "no release"
      # and skipping promote-prod green (WEB-117; the script says why).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/release-gate.sh
          sparse-checkout-cone-mode: false
      - id: gate
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: scripts/release-gate.sh

  meta:
    name: Compute tag
    runs-on: ubuntu-latest
    # Two echo lines: 2 s on average, 4 s at worst over 15 runs.
    timeout-minutes: 2
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      # One computation for both: the image's /version.json states `commit`,
      # and it must be the tag minus `sha-` by construction (WEB-150).
      - id: meta
        run: |
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # The same suite a pull request runs (test.yml), run again on the merge
  # commit. A PR's checks ran against its own head, and `strict: false` lets it
  # merge against a stale base, so the tree this push carries is not the one
  # that went green. `build` needs this job, which puts it in front of
  # everything that ships: `dispatch-staging` and `promote-prod` both need
  # `build`, so a red suite leaves no `sha-<short>` image to send to staging
  # and no digest to re-tag for prod (#343).
  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build:
    name: Build staging image
    needs: [meta, test]
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/build-image.yml
    with:
      tag: ${{ needs.meta.outputs.sha_tag }}
      commit: ${{ needs.meta.outputs.commit }}
      push: true
      platforms: linux/amd64,linux/arm64
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # The suite again, on the bytes that ship (#376). `test` above checked a
  # runner build of this commit; the image carries a second build of it, and
  # that one is what staging and prod serve. This extracts the served tree of
  # every platform in the digest `build` pushed, refuses them if they differ,
  # and runs the same steps against it. Both shippers below need it directly:
  # `promote-prod` does not go through `dispatch-staging`.
  test-image:
    name: Test shipped image
    needs: [meta, build]
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      image: docker.io/mlorentedev/kubelab-web@${{ needs.build.outputs.digest }}
      commit: ${{ needs.meta.outputs.commit }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  dispatch-staging:
    name: Notify kubelab (staging)
    needs: [meta, build, test-image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Docker Hub login, a digest lookup and one dispatch: 16 s on average, 24 s
    # at worst over 15 runs.
    timeout-minutes: 5
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # kubelab is sent the tag, and resolves it itself. Refuse to send it
      # unless it still names the digest `test-image` tested: a tag is a
      # pointer anyone with push rights can move after the test ran.
      - name: Require the tag to name the tested digest
        env:
          IMAGE: docker.io/mlorentedev/kubelab-web
          TAG: ${{ needs.meta.outputs.sha_tag }}
          TESTED: ${{ needs.build.outputs.digest }}
        run: |
          resolved=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "tested:   ${IMAGE}@${TESTED}"
          echo "${TAG}: ${IMAGE}@${resolved}"
          if [ "$resolved" != "$TESTED" ]; then
            echo "::error::${IMAGE}:${TAG} no longer names the digest the suite tested"
            exit 1
          fi

      - name: Fire repository_dispatch to kubelab
        env:
          TOKEN: ${{ secrets.KUBELAB_DISPATCH_TOKEN }}
          TAG: ${{ needs.meta.outputs.sha_tag }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mlorentedev/kubelab/dispatches \
            -d "$(printf '{"event_type":"web-image-published","client_payload":{"tag":"%s","sha":"%s"}}' "$TAG" "$GITHUB_SHA")"
          echo "Dispatched web-image-published (tag=$TAG) to mlorentedev/kubelab"

  promote-prod:
    name: Promote digest to semver
    needs: [release-please, meta, build, test-image]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # A manifest re-tag on Docker Hub plus one dispatch, measured at 22 s on the
    # 1.16.0 release. A higher cap than its peers because a stall here is the
    # costly one: a timeout leaves a release with no prod promotion.
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Re-tag the validated digest as the semver release
        env:
          IMAGE: docker.io/mlorentedev/kubelab-web
          SHA_TAG: ${{ needs.meta.outputs.sha_tag }}
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          # ADR-055 build-once / promote-by-digest: the prod semver tag points at
          # the exact image staging validated — re-tag the manifest (multi-arch
          # preserved), never rebuild. Tags semver (e.g. 1.11.0) and latest.
          # The source is the digest `test-image` tested, not `SHA_TAG`, which
          # names the same bytes only for as long as nobody moves it (#376).
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}@${DIGEST}"
          echo "Promoted ${IMAGE}@${DIGEST} (${SHA_TAG}) -> ${IMAGE}:${VERSION}, ${IMAGE}:latest"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Notify kubelab (prod promotion)
        env:
          TOKEN: ${{ secrets.KUBELAB_DISPATCH_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mlorentedev/kubelab/dispatches \
            -d "$(printf '{"event_type":"web-release-published","client_payload":{"version":"%s"}}' "$VERSION")"
          echo "Dispatched web-release-published (version=$VERSION) to mlorentedev/kubelab"
