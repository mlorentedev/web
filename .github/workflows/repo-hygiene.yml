name: Repo hygiene

# Four guards: the lessons check runs dotf through the fleet's hygiene composite
# (ci-workflows CI-005); SHA-pinned actions, docs paths that exist and the
# AGENTS.md stack majors are scripts that run under bash and zsh.
#
# Two callers, as with test.yml (WEB-124):
#   - pr-validation.yml calls it as `hygiene`, a job in `gate.needs`, so a red
#     check here blocks the merge. With its own `pull_request` trigger it ran in
#     a workflow `gate` cannot observe, and a red square beside a green gate
#     blocked nothing.
#   - the push to master runs it again after a merge, where no gate applies.
# No `pull_request` trigger of its own: it would run each check twice per PR,
# under two names.

on:
  workflow_call:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lessons numbering and format
        uses: mlorentedev/ci-workflows/.github/actions/hygiene@2355330358344bb08c0b7a305be4ed6488f23d0c # v0.6.0
      - name: Actions pinned to commit SHAs
        run: bash scripts/check-actions-pinned.sh
      - name: Docs paths named in the repo exist
        run: bash scripts/check-doc-refs.sh
      - name: AGENTS.md stack majors match package.json
        run: bash scripts/check-agents-stack.sh
