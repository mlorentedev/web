name: Repo hygiene

# Four guards that need no toolchain: lesson numbering/index integrity,
# SHA-pinned actions, docs paths that exist, and the AGENTS.md stack majors.
# All four run under bash and zsh and print what failed.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lessons numbering and index
        run: bash scripts/check-lessons.sh
      - name: Actions pinned to commit SHAs
        run: bash scripts/check-actions-pinned.sh
      - name: Docs paths named in the repo exist
        run: bash scripts/check-doc-refs.sh
      - name: AGENTS.md stack majors match package.json
        run: bash scripts/check-agents-stack.sh
