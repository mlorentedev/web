---
name: PR Validation

# Validate that the Dockerfile builds on pull requests (no push, no deploy).
# The master-push delivery — build the `sha-<short>` image, ship it to staging,
# and re-tag that digest to a semver release for prod — lives in release.yml
# (ADR-055: one build serves both environments by digest).

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # The suite is Node's built-in runner over `site/tests/*.test.mjs`; the
    # slowest job here is the Astro build it depends on, which takes ~10 s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # The build renders the notes' mermaid diagrams through a headless browser
      # (#176), so it needs one — `npm ci` installs the Playwright package but
      # never its browsers. The image build has the same requirement and meets
      # it in the Dockerfile with `install-deps chromium` as root followed by
      # `playwright install chromium`; `--with-deps` is the runner's equivalent.
      # Without this the build dies on the first .mdx with a diagram in it.
      - name: Install Chromium for the diagram renderer
        working-directory: site
        run: npx playwright install --with-deps chromium

      # `npm run build` must come first and is not redundant with the Docker
      # build above: the audit tests read `dist/`, and the image build produces
      # it inside a layer this job never sees. It also runs `astro check` and
      # the `prebuild` diagram verification, so a malformed or stale IR fails
      # here too.
      - name: Build
        working-directory: site
        run: npm run build

      - name: Test
        working-directory: site
        run: npm test

      # WEB-080 AC2, enabled with PR4 — before it there was no generated SVG on
      # the page, so a pass would have meant the check was looking at nothing.
      # It loads `/lab` and `/es/lab` in the Chromium installed above at 320,
      # 768, 1440 and 2048 and asserts the *document* never scrolls sideways
      # while each diagram scrolls inside its own container: 754 px is the width
      # at which the smallest text reaches archify's 6 px floor, and below that
      # the diagram cannot be both visible and legible. It serves `dist/`
      # itself, so nothing needs to be listening beside it.
      - name: Containment (320 / 768 / 1440 / 2048, both locales)
        working-directory: site
        run: npm run test:browser

      # WEB-080 AC5, enabled with PR7. axe-core over both locales in the same
      # Chromium. It fulfils the reachability console's `/health` request from a
      # fixture and audits the page twice — once healthy, once degraded — so the
      # verdict covers both of the console's colour paths and never depends on
      # whether the live API answers a GitHub runner.
      - name: Accessibility (axe, both locales)
        working-directory: site
        run: npm run test:a11y

  validate:
    name: Validate build
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/build-image.yml
    with:
      tag: pr-${{ github.event.pull_request.number }}
      push: false
      platforms: linux/amd64
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # One context with a stable name, so branch protection can require it.
  #
  # `#275` measured that `master` required *nothing*: a pull request was
  # mechanically mergeable with every check red. Attaching the checks directly
  # only half works, because `validate` reports as `Validate build / Build
  # pr-<N>` — the PR number is in the context string, so a required context
  # naming one PR never matches any other and gates nothing at all. That is the
  # same shape as the guards this repo spent WEB-080 removing: a rule that
  # cannot fire.
  #
  # So the required context is this job, whose name never changes. Adding a job
  # above means adding it to `needs` here; nothing else has to be touched in the
  # protection settings, and forgetting to is visible in this file rather than in
  # an API response nobody reads.
  gate:
    name: PR gate
    # `always()` is what makes this a gate rather than a formality: without it
    # the job is skipped when a dependency fails, and a skipped required check
    # does not block a merge — it reports neutral. The job has to *run* and fail.
    if: always()
    needs: [test, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Each result is compared against `success` explicitly rather than trusted
      # to `needs`, because `needs` treats a **skipped** dependency as satisfied.
      # A job skipped by a path filter, a cancelled run, or one that never
      # started for want of a runner would otherwise all read as a pass — which
      # is exactly how a green square comes to mean nothing.
      - name: Require every validation job to have succeeded
        env:
          TEST_RESULT: ${{ needs.test.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          echo "Test:           $TEST_RESULT"
          echo "Validate build: $VALIDATE_RESULT"
          failed=0
          for pair in "Test:$TEST_RESULT" "Validate build:$VALIDATE_RESULT"; do
            name="${pair%%:*}"
            result="${pair##*:}"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed (result: $result)"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "All validation jobs succeeded."
