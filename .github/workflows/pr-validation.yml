---
name: PR Validation

# Validate that the Dockerfile builds on pull requests (no push, no deploy).
# The master-push delivery — build the `sha-<short>` image, ship it to staging,
# and re-tag that digest to a semver release for prod — lives in release.yml
# (ADR-055: one build serves both environments by digest).

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # The suite is Node's built-in runner over `site/tests/*.test.mjs`; the
    # slowest job here is the Astro build it depends on, which takes ~10 s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # The build renders the notes' mermaid diagrams through a headless browser
      # (#176), so it needs one — `npm ci` installs the Playwright package but
      # never its browsers. The image build has the same requirement and meets
      # it in the Dockerfile with `install-deps chromium` as root followed by
      # `playwright install chromium`; `--with-deps` is the runner's equivalent.
      # Without this the build dies on the first .mdx with a diagram in it.
      - name: Install Chromium for the diagram renderer
        working-directory: site
        run: npx playwright install --with-deps chromium

      # `npm run build` must come first and is not redundant with the Docker
      # build above: the audit tests read `dist/`, and the image build produces
      # it inside a layer this job never sees. It also runs `astro check` and
      # the `prebuild` diagram verification, so a malformed or stale IR fails
      # here too.
      - name: Build
        working-directory: site
        run: npm run build

      - name: Test
        working-directory: site
        run: npm test

      # WEB-080 AC2, enabled with PR4 — before it there was no generated SVG on
      # the page, so a pass would have meant the check was looking at nothing.
      # It loads `/lab` and `/es/lab` in the Chromium installed above at 320,
      # 768, 1440 and 2048 and asserts the *document* never scrolls sideways
      # while each diagram scrolls inside its own container: 754 px is the width
      # at which the smallest text reaches archify's 6 px floor, and below that
      # the diagram cannot be both visible and legible. It serves `dist/`
      # itself, so nothing needs to be listening beside it.
      - name: Containment (320 / 768 / 1440 / 2048, both locales)
        working-directory: site
        run: npm run test:browser

      # WEB-080 AC5, enabled with PR7. axe-core over both locales in the same
      # Chromium. It fulfils the reachability console's `/health` request from a
      # fixture and audits the page twice — once healthy, once degraded — so the
      # verdict covers both of the console's colour paths and never depends on
      # whether the live API answers a GitHub runner.
      - name: Accessibility (axe, both locales)
        working-directory: site
        run: npm run test:a11y

  validate:
    name: Validate build
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/build-image.yml
    with:
      tag: pr-${{ github.event.pull_request.number }}
      push: false
      platforms: linux/amd64
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # WEB-103. release-please builds the release PR body from the changelog, and
  # the changelog reproduces each commit subject *including its closing
  # keywords* — so a commit that once said `closes #N` re-arms that keyword on
  # the release PR, whether or not `#N` is still finished.
  #
  # `#184` carried `closes [#244](…)` from `9f29f1c`, and `#244` is open on
  # purpose: `#248` fixed it interim. The manual defence — edit the line to
  # `refs` immediately before merging — was applied, and lost 37 minutes later
  # when an unrelated docs PR merged and regenerated the body. *Any* push to
  # master re-arms it, not only a releasable one, so the manual step has to be
  # redone after every merge and will eventually be skipped.
  #
  # The job runs on every PR rather than being conditioned on the branch,
  # because `gate` treats a **skipped** dependency as a failure — deliberately,
  # see below. So the branch test lives inside the step, which exits 0 with a
  # sentence for anything that is not a release branch.
  closing-refs:
    name: Release closing refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Everything from the event goes through `env` rather than straight into
      # the script — `head_ref` is a branch name, which a fork controls.
      #
      # The query is the check. A grep over the body is not equivalent and was
      # measured returning nothing on a body that plainly contained one:
      # release-please writes `closes [#244](url)`, the markdown-link form,
      # which GitHub parses and a `closes[[:space:]]*#` pattern does not.
      - name: Refuse a release PR that would close an issue still open
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # The query runs on EVERY pull request, and only the enforcement is
          # conditional. If it ran solely on release branches, a wrong token
          # scope or a renamed field would first surface on the one PR whose job
          # is to ship. Off a release branch the checker runs `--advisory`:
          # closing an open issue is the intended case there and passes, while an
          # unreadable answer still fails. So the plumbing is exercised
          # continuously and the rule is applied where it belongs.
          case "$HEAD_REF" in
            release-please--branches--*) mode="" ;;
            *) mode="--advisory" ;;
          esac

          # SC2016 fires on `$owner`/`$name`/`$number` below. They are GraphQL
          # variables, bound by the `-f`/`-F` flags on the same command, and
          # single quotes are what keeps the shell from eating them. Expanding
          # them would send an empty query.
          # shellcheck disable=SC2016
          payload=$(gh api graphql \
            -f owner="$OWNER" -f name="$REPO" -F number="$PR_NUMBER" \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 50) { nodes { number state title } }
                }
              }
            }')

          printf '%s' "$payload" | node scripts/check-closing-refs.mjs ${mode:+"$mode"}

  # One context with a stable name, so branch protection can require it.
  #
  # `#275` measured that `master` required *nothing*: a pull request was
  # mechanically mergeable with every check red. Attaching the checks directly
  # only half works, because `validate` reports as `Validate build / Build
  # pr-<N>` — the PR number is in the context string, so a required context
  # naming one PR never matches any other and gates nothing at all. That is the
  # same shape as the guards this repo spent WEB-080 removing: a rule that
  # cannot fire.
  #
  # So the required context is this job, whose name never changes. Adding a job
  # above means adding it to `needs` here and nothing else — not the step below,
  # which derives what it checks from `needs` itself, and not the protection
  # settings, which keep naming this one context.
  #
  # That "and nothing else" is the second version of this job. The first listed
  # the results a second time inside the step, so a job added to `needs` but not
  # to that list was *counted as a dependency and never checked* — the gate would
  # wait for it, then pass green whatever it did. A gate whose coverage silently
  # lags its own dependency list is worse than no gate, because it is believed.
  gate:
    name: PR gate
    # `always()` is what makes this a gate rather than a formality: without it
    # the job is skipped when a dependency fails, and a skipped required check
    # does not block a merge — it reports neutral. The job has to *run* and fail.
    if: always()
    needs: [test, validate, closing-refs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Each result is compared against `success` explicitly rather than trusted
      # to `needs`, because `needs` treats a **skipped** dependency as satisfied.
      # A job skipped by a path filter, a cancelled run, or one that never
      # started for want of a runner would otherwise all read as a pass — which
      # is exactly how a green square comes to mean nothing.
      #
      # `toJSON(needs)` is what keeps the list in one place: Actions serialises
      # the whole context — `{"test":{"result":"success",…},…}` — so every job in
      # `needs` is checked by construction and none can be added without being.
      # It goes through `env` rather than straight into the script, the standard
      # precaution against a context interpolated into a shell.
      - name: Require every job in `needs` to have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          # A gate with no dependencies passes green having verified nothing, so
          # it asserts it has something to check before checking it. This is the
          # `lesson-019` shape: a test that cannot fail is not a test.
          total=$(printf '%s' "$NEEDS_JSON" | jq 'length')
          if [ "$total" -eq 0 ]; then
            echo "::error::the gate has no dependencies — it would pass without checking anything"
            exit 1
          fi

          printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'

          failed=$(printf '%s' "$NEEDS_JSON" |
            jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) (\(.value.result))"')
          if [ -n "$failed" ]; then
            printf '%s\n' "$failed" | while IFS= read -r job; do
              echo "::error::$job did not succeed"
            done
            exit 1
          fi

          echo "All $total required job(s) succeeded."
