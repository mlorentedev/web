---
name: Test

# Reusable test suite. One definition, two callers, so the tree a pull request
# is checked against and the tree production ships are checked by the same
# steps:
#   - pr-validation.yml -> on every pull request, required through `PR gate`
#   - release.yml       -> on every push to master, in `build`'s `needs`, so a
#                          red suite stops the `sha-<short>` image from being
#                          built, dispatched to staging, or re-tagged for prod
#
# Before #343 the suite ran on pull requests only, and `strict: false` lets a
# PR merge against a stale base, so the merge commit — the one `build` turns
# into the image ADR-055 promotes by digest — had never had a test run against
# it. Keeping the steps here rather than copying them into release.yml is what
# stops the two runs drifting apart (`lesson-029`): a suite added below is run
# by both callers without either having to be edited.
#
# `image` picks where `dist/` comes from, and nothing else changes (#376):
#   - empty (both callers above) -> `npm run build` on the runner
#   - `<name>@sha256:<digest>`   -> the tree that image serves, extracted by
#     `site/scripts/served-tree.mjs`. release.yml calls the suite a second time
#     this way on the image `build` pushed, so the bytes staging and prod serve
#     are the bytes that were tested, not a sibling build of the same commit.
#
# The runner build stays, on purpose. A pull request publishes no image, so it
# is the only way a PR gets tested at all; and on the master push it fails in
# about a minute, before the multi-platform image build spends five, and leaves
# no `sha-<short>` behind. Only on the master push are there two builds, and the
# second run is the one that answers for what ships.
#
# `commit` is what the tree must state as `commit` in /version.json (WEB-150).
# release.yml passes its tag's sha to the image run, so that run proves the
# shipped bytes name their own tag. Empty means "local", the runner build.

on:
  workflow_call:
    inputs:
      image:
        description: Test the tree this image serves (`<name>@sha256:<digest>`) instead of a runner build
        type: string
        default: ''
      commit:
        description: The short sha the tested tree must state as `commit` (empty = "local")
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Measured 2026-11-06: the build, the suite, containment and axe take about
    # 3 minutes together. The step that varies is
    # `playwright install --with-deps`: its apt fetch from the runner's Ubuntu
    # mirror took 7 to 8 minutes on three runs (21 MB at 53 kB/s), and at 10
    # minutes the job was cancelled during axe with nothing failing. 20 leaves
    # room for a slow mirror and still stops a hung job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # The build renders the notes' mermaid diagrams through a headless browser
      # (#176), so it needs one — `npm ci` installs the Playwright package but
      # never its browsers. The image build has the same requirement and meets
      # it in the Dockerfile with `install-deps chromium` as root followed by
      # `playwright install chromium`; the steps below are the runner's
      # equivalent. Without them the build dies on the first .mdx with a diagram.
      #
      # Both halves are cached, keyed on the Playwright version npm resolved,
      # since each version pins its own Chromium build and its own package list.
      # The slow half was apt: on three runs it fetched 21 MB of fonts from the
      # runner's Ubuntu mirror at 53 kB/s, 7 to 8 minutes of a job that was then
      # cancelled during axe, and the gate said only "test (cancelled)" (WEB-201).
      # apt is pointed at a cached directory and told to keep what it downloads,
      # so a warm run installs from local .deb files. Each install step has its
      # own budget, under the job's, so a stalled fetch fails on its own name.
      - name: Resolve the Playwright version
        id: playwright
        working-directory: site
        # `image` is the runner's own ImageVersion, read in the shell: the
        # `env` context of an expression holds only what a workflow sets.
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:?the runner does not state its image version}" >> "$GITHUB_OUTPUT"

      # Restore and save are separate steps: the combined action saves in its
      # post step, which does not run when a later step fails, so a run that
      # failed would download again next time.
      - name: Restore Chromium from the cache
        id: chromium-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Download Chromium for the diagram renderer
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        working-directory: site
        timeout-minutes: 4
        run: npx playwright install chromium

      - name: Save Chromium to the cache
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium-cache.outputs.cache-primary-key }}

      - name: Restore Chromium's system packages from the cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          # The runner image pins the package versions, so a new image saves a
          # fresh cache, and starts from the last one: most .deb files carry over.
          # The image names the OS too, so `runner.os` would only repeat it.
          key: pw-apt-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.image }}
          restore-keys: pw-apt-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-

      # 12 minutes: a cold fetch from a slow mirror took 8 and must still pass.
      # The chown lets the cache step read what apt, as root, wrote.
      - name: Install Chromium's system libraries
        working-directory: site
        timeout-minutes: 12
        run: |
          mkdir -p ~/.cache/playwright-apt/partial
          printf 'Dir::Cache::Archives "%s";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' \
            "$HOME/.cache/playwright-apt" | sudo tee /etc/apt/apt.conf.d/90-playwright-cache
          npx playwright install-deps chromium
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/playwright-apt

      - name: Save Chromium's system packages to the cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      # `npm run build` must come first and is not redundant with the Docker
      # build: the audit tests read `dist/`, and the image build produces it
      # inside a layer this job never sees. It also runs `astro check` and the
      # `prebuild` diagram verification, so a malformed or stale IR fails here
      # too.
      #
      # It builds with a `SITE_COMMIT`, as the shipped image does, so the audits
      # read the markup that ships. A build without one renders the `local`
      # variant of any commit-dependent element, and a defect only the deployed
      # variant carries passed every PR check (lesson-068). `$GITHUB_ENV` hands
      # the same value to the test steps, which assert the commit dist states.
      - name: Build
        if: inputs.image == ''
        working-directory: site
        run: |
          echo "SITE_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          SITE_COMMIT="${GITHUB_SHA::7}" npm run build

      # Authenticated so the pulls count against the account, not the runner's
      # shared anonymous allowance. Read-only use of the push credentials.
      - name: Login to Docker Hub
        if: inputs.image != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Every platform of the image is extracted and they must serve the same
      # tree, or this fails: the pod may land on either architecture.
      - name: Extract the tree the image serves
        if: inputs.image != ''
        working-directory: site
        env:
          IMAGE: ${{ inputs.image }}
        run: node scripts/served-tree.mjs "$IMAGE" dist

      # The login above stores the push-capable token in ~/.docker/config.json,
      # and everything below runs dependency code. Drop it before that starts,
      # and on failure too.
      - name: Logout from Docker Hub
        if: always() && inputs.image != ''
        run: docker logout docker.io

      # EXPECTED_COMMIT lets site-version.test.mjs assert the shipped tree
      # states the commit its tag names, not merely some short sha (WEB-150).
      - name: Test
        working-directory: site
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: npm test

      # What nginx sends can only be read off a running server (#328): `expires`
      # beside `add_header` gave every asset two Cache-Control headers, and the
      # file looked fine. Only on an image run, because a pull request publishes
      # no image; there, nginx-cache.test.mjs checks the config statically.
      - name: Cache headers from the running image
        if: inputs.image != ''
        working-directory: site
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker run -d --rm -p 8080:8080 --name web-probe "$IMAGE"
          trap 'docker rm -f web-probe >/dev/null' EXIT
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          node tests/nginx-cache-probe.mjs http://localhost:8080

      # WEB-080 AC2, enabled with PR4 — before it there was no generated SVG on
      # the page, so a pass would have meant the check was looking at nothing.
      # It loads `/lab` and `/es/lab` in the Chromium installed above at 320,
      # 768, 1440 and 2048 and asserts the *document* never scrolls sideways
      # while each diagram scrolls inside its own container: 754 px is the width
      # at which the smallest text reaches archify's 6 px floor, and below that
      # the diagram cannot be both visible and legible. It serves `dist/`
      # itself, so nothing needs to be listening beside it.
      - name: Containment (320 / 768 / 1440 / 2048, both locales)
        working-directory: site
        run: npm run test:browser

      # WEB-080 AC5, enabled with PR7. axe-core over both locales in the same
      # Chromium. Any request to another origin fails the run, so the verdict
      # never depends on whether the live API answers a GitHub runner (#280).
      - name: Accessibility (axe, both locales)
        working-directory: site
        run: npm run test:a11y
