# Pre-commit hooks for the web repo (mlorente.dev frontend).
# Requires pre-commit (Python tool): pipx install pre-commit
# Install: pre-commit install
# Run manually: pre-commit run --all-files

# A hook with no `stages` runs at every hook type git fires, and with hooks
# dispatched through `core.hooksPath` that was three runs per commit (#99).
default_stages: [pre-commit]

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: 'tsconfig\.json$'   # tsconfig is JSONC (allows comments)
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: detect-private-key

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        # Also before a push: a commit made with --no-verify is still caught
        # before it leaves the machine.
        stages: [pre-commit, pre-push]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.46.0
    hooks:
      - id: markdownlint
        args: ['--fix', '--disable', 'MD013', 'MD033', 'MD041']
        exclude: 'CHANGELOG\.md'

  # YAML linting (workflow files)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args:
          - '-d'
          - >-
            {extends: default,
            rules: {
              line-length: {max: 130},
              document-start: disable,
              truthy: {check-keys: false},
              comments-indentation: disable
            }}
        # Owned upstream: mlorentedev/dotfiles deploys these byte-for-byte
        # (scripts/bitacora-rollout.sh), and any local reflow is drift the next
        # rollout reverts. Lint them where they are written.
        exclude: '^\.github/workflows/(add-to-project|bitacora-status)\.yml$'

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker

  # Lessons format and numbering: the same dotf check CI runs through the fleet's
  # hygiene composite. dotf is the fleet's tool; a clone without it fails this hook
  # rather than skipping it.
  - repo: local
    hooks:
      - id: lessons-fmt
        name: Check docs/lessons format and that no index is committed
        language: system
        entry: dotf lessons fmt --check --dir docs/lessons
        pass_filenames: false
        files: ^docs/lessons/

  # Docs paths named in .github/, scripts/, docs/ and the root docs exist (scripts/check-doc-refs.sh)
  - repo: local
    hooks:
      - id: check-doc-refs
        name: check-doc-refs
        language: script
        entry: scripts/check-doc-refs.sh
        pass_filenames: false
        # site/, harness/ and the root files are read by its ADR check (#361).
        files: |
          (?x)^(
            \.github/|scripts/|docs/|site/|harness/|
            (AGENTS|README|CONTRIBUTING)\.md$|Makefile$|Dockerfile$|kubelab\.yaml$
          )

  # The Astro and Tailwind CSS majors in AGENTS.md match site/package.json (scripts/check-agents-stack.sh)
  - repo: local
    hooks:
      - id: check-agents-stack
        name: check-agents-stack
        language: script
        entry: scripts/check-agents-stack.sh
        pass_filenames: false
        files: ^(AGENTS\.md|site/package\.json|scripts/check-agents-stack\.sh)$

# Files to exclude
exclude: |
  (?x)^(
      \.claude/.*|
      \.vscode/.*|
      \.git/.*|
      node_modules/.*|
      site/node_modules/.*|
      site/dist/.*|
      site/tests/fixtures/ai-artifacts/.*
  )$
