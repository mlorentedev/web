# Overnight run, armed by Manu before sleeping. Read from the committed copy only.
version: 1
run_id: "web-2026-11-06-overnight"
armed_by: manu
armed_at: 2026-11-06T06:55:00Z
expires_at: 2026-11-06T14:55:00Z
objective: "Land review-ready PRs for the structure and data halves of #590, #592 and #593, and keep #597, #614, #616 and #617 green and triaged."
scope:
  write_paths:
    - "site/src/**"
    - "site/tests/**"
    - "site/scripts/**"
    - "docs/lessons/**"
    - ".agent/**"
  frozen_paths:
    - ".github/**"
    - "harness/**"
    - "**/AGENTS.md"
    - "kubelab.yaml"
    - "Dockerfile"
    - "site/src/content/pages/**"   # page copy is the owner's voice
  max_files: 12
  max_loc: 300
allowed_commands: [dotf, gh, git, npm, npx, node, make, docker]
queue:
  source: bitacora
  filter: "web#590, web#592, web#593 (structure and data only; copy and figures about the owner stay out)"
  max_items: 3
budget:
  max_iterations: 8
  max_minutes_per_iteration: 60
  max_consecutive_failures: 2
authority:
  merge: never          # no .github/merge-grant.yml in web; Manu merges every PR
  push: true
  open_pr: true
  advisor_tier: top
rules:
  - "Notes under site/src/content/notes: frontmatter only (series, order, kind), never the body."
  - "No copy in the owner's voice, no figure or claim about Manu, no \"certified\", no employer IP."
  - "Data comes from git or the GitHub API, never typed from memory."
  - "PRs open as drafts; mark ready only when green and triaged."
  - "Never push to a PR that is not OPEN; resolve conflicts by merging origin/master."
  - "Peers: fix-focus-visible-c4 owns nav, a11y and UI; feat-load-test-capacity-c4 owns load tests. Ping the load-test peer when #616 reaches staging."
