version: 1
run_id: ""
armed_by: manu
armed_at: 2026-10-21T14:40:00Z
expires_at: 2026-10-21T21:40:00Z
objective: >-
  Harden web's delivery chain while Manu is away: verify staging serves commit 9d79e52
  once kubelab#2581 merges, and turn pilot-eligible delivery/CI tickets into PRs ready
  for Manu's review.
branch: chore/delivery-chain-run
scope:
  write_paths:
    - ".github/workflows/**"
    - "Dockerfile"
    - ".dockerignore"
    - ".nvmrc"
    - "README.md"
    - "docs/**"
    - "scripts/**"
    - "site/tests/**"
    - "site/scripts/**"
    - "site/package.json"
    - "site/nginx.conf"
    - ".agent/runs/**"
  frozen_paths:
    - ".github/merge-grant.yml"
    - "harness/**"
    - "**/AGENTS.md"
    - ".agent/unattended.yml"
    - "kubelab.yaml"
    - "version.txt"
    - ".release-please-manifest.json"
    - "release-please-config.json"
    - "site/src/**"
  max_files: 8
  max_loc: 300
allowed_commands: [dotf, gh, git, make, npm, npx, node, curl, docker, jq]
queue:
  source: bitacora
  filter: "explicit list, in order: web#446, web#344, web#164, web#345, web#177, web#302"
  max_items: 4
budget:
  max_iterations: 8
  max_minutes_per_iteration: 45
  max_consecutive_failures: 2
authority:
  merge: never
  push: true
  open_pr: true
  advisor_tier: top
