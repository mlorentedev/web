version: 1
run_id: "web-2026-11-02-night"
armed_by: manu
armed_at: 2026-11-02T05:50:00Z
expires_at: 2026-11-02T17:50:00Z
objective: "Open reviewed, green PRs for the small non-copy web tickets in the queue, leaving every merge to the owner."
scope:
  write_paths:
    - "site/src/components/**"
    - "site/src/layouts/**"
    - "site/src/styles/**"
    - "site/tests/**"
    - "site/scripts/**"
    - "site/public/fonts/**"
    - "site/package.json"
    - "site/package-lock.json"
    - "skills-lock.json"
    - "docs/lessons/**"
    - ".agent/runs/**"
  frozen_paths:
    - ".github/**"
    - "harness/**"
    - "**/AGENTS.md"
    - ".agent/unattended.yml"
    - "site/src/content/pages/**"
    - "site/src/i18n/ui.ts"
    - "site/nginx.conf"
    - "Dockerfile"
    - "kubelab.yaml"
    # Reserved by the content run until its PR lands; these carve out of write_paths.
    - "site/src/components/Hero.astro"
    - "site/src/components/HomePage.astro"
    - "site/src/components/HomeStory.astro"
    - "site/src/components/HomeSkills.astro"
    - "site/src/components/HomeDoor.astro"
    - "site/src/components/HomeActivity.astro"
    - "site/src/components/Door.astro"
    - "site/src/components/Offer.astro"
    - "site/src/data/**"
    - "site/tests/home.test.mjs"
    - "site/tests/skills.test.mjs"
    - "site/tests/bio.test.mjs"
    - "site/tests/contact.test.mjs"
    - "site/tests/home-first-screen.mjs"
  max_files: 15
  max_loc: 300
allowed_commands: [dotf, gh, git, npm, npx, node, docker, jq, python3, make]
queue:
  source: bitacora
  filter: "explicit, in order: #412, #130, #252, #352, #358, #139, #393"
  max_items: 7
budget:
  max_iterations: 8
  max_minutes_per_iteration: 60
  max_consecutive_failures: 2
authority:
  merge: never
  push: true
  open_pr: true
  advisor_tier: top
